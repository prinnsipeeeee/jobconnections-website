<!-- Request Assistance Modal -->
<div
  id="assistance-modal"
  class="fixed inset-0 z-9999 hidden bg-black/70 backdrop-blur-sm overflow-y-auto"
>
  <!-- Center Container -->
  <div class="min-h-screen flex justify-center items-start py-10 px-4">

    <!-- Modal -->
    <div
      id="assistance-panel"
      class="relative w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden"
    >

      <!-- Close -->
      <button
        id="close-assistance"
        class="absolute top-5 right-5 w-11 h-11 rounded-full bg-red-600 text-white hover:bg-red-700 transition z-50"
      >
        ✕
      </button>

      <!-- Header -->
      <div class="bg-linear-to-r from-red-600 to-red-700 px-10 py-12 text-center">

        <div
          class="mx-auto w-20 h-20 rounded-full bg-white/20 flex items-center justify-center"
        >
          <i
            data-lucide="headset"
            class="w-10 h-10 text-white"
          ></i>
        </div>

        <h2 class="mt-6 text-4xl font-bold text-white">
          Complaint Form
        </h2>

        <p class="mt-3 text-red-100 max-w-xl mx-auto leading-7">
          Submit your complaint. All fields marked with * are required.
        </p>

      </div>

      <!-- BODY -->
      <div class="max-h-[70vh] overflow-y-auto p-8 md:p-10">

        <form class="space-y-6">

          <!-- Agency -->
          <div>
              <label class="block mb-2 font-medium text-gray-700">
                  Foreign Recruitment Agency *
              </label>

              <input
                  type="text"
                  placeholder="Enter agency name"
                  class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none">
          </div>

          <!-- Name -->
          <div>
              <label class="block mb-2 font-medium text-gray-700">
                  OFW Full Name *
              </label>

              <input
                  type="text"
                  placeholder="Enter your full name"
                  class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none">
          </div>

          <!-- Gender + Birthdate -->
          <div class="grid md:grid-cols-2 gap-6">

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      Gender *
                  </label>

                  <select class="w-full rounded-xl border border-gray-300 px-5 py-4">
                      <option>Select Gender</option>
                      <option>Male</option>
                      <option>Female</option>
                  </select>
              </div>

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      Birthdate *
                  </label>

                  <input
                      type="date"
                      class="w-full rounded-xl border border-gray-300 px-5 py-4">
              </div>

          </div>

          <!-- Occupation -->
          <div>
              <label class="block mb-2 font-medium text-gray-700">
                  Occupation *
              </label>

              <input
                  type="text"
                  placeholder="Domestic Helper"
                  class="w-full rounded-xl border border-gray-300 px-5 py-4">
          </div>

          <!-- IDs -->
          <div class="grid md:grid-cols-2 gap-6">

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      National ID *
                  </label>

                  <input
                      type="text"
                      class="w-full rounded-xl border border-gray-300 px-5 py-4">
              </div>

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      Passport Number *
                  </label>

                  <input
                      type="text"
                      class="w-full rounded-xl border border-gray-300 px-5 py-4">
              </div>

          </div>

          <!-- Email + Contact -->
          <div class="grid md:grid-cols-2 gap-6">

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      Email Address *
                  </label>

                  <input
                      type="email"
                      class="w-full rounded-xl border border-gray-300 px-5 py-4">
              </div>

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      Contact Number *
                  </label>

                  <input
                      type="text"
                      class="w-full rounded-xl border border-gray-300 px-5 py-4">
              </div>

          </div>

          <!-- Emergency -->
          <div class="grid md:grid-cols-2 gap-6">

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      Primary Contact *
                  </label>

                  <input
                      type="text"
                      class="w-full rounded-xl border border-gray-300 px-5 py-4">
              </div>

              <div>
                  <label class="block mb-2 font-medium text-gray-700">
                      Secondary Contact
                  </label>

                  <input
                      type="text"
                      class="w-full rounded-xl border border-gray-300 px-5 py-4">
              </div>

          </div>

          <!-- Address -->
          <div>

              <label id="address" class="block mb-2 font-medium text-gray-700">
                  Address Abroad *
              </label>

              <textarea
                  rows="3"
                  class="w-full rounded-xl border border-gray-300 px-5 py-4 resize-none"></textarea>

          </div>

           <button
              type="button"
              id="use-location"
              class="mt-3 inline-flex items-center gap-2 rounded-lg border border-red-600 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 transition">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
              Use My Location
          </button>

          <!-- Complaint -->
          <div>

              <label class="block mb-2 font-medium text-gray-700">
                  Complaint *
              </label>

              <textarea
                  rows="6"
                  placeholder="Describe your complaint..."
                  class="w-full rounded-xl border border-gray-300 px-5 py-4 resize-none"></textarea>

          </div>

          <!-- Evidence -->
          <div>

              <label class="block mb-2 font-medium text-gray-700">
                  Upload Evidence
              </label>

              <input
                  type="file"
                  multiple
                  class="block w-full rounded-xl border border-gray-300 p-4">

              <p class="text-sm text-gray-500 mt-2">
                  Accepted formats: JPG, PNG, GIF, PDF, DOC, DOCX
              </p>

          </div>

          <!-- Buttons -->
          <div class="flex justify-end gap-4 pt-4">

              <button
                  type="button"
                  id="close-assistance-bottom"
                  class="px-6 py-3 rounded-xl border border-gray-300 hover:bg-gray-100 transition">
                  Cancel
              </button>

              <button
                  type="submit"
                  class="px-8 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold transition">
                  Submit Complaint
              </button>

          </div>
        </form>
      </div>
    </div>
  </div>
</div>
