<!-- Request Assistance Modal -->
<div
  id="assistance-modal"
  class="fixed inset-0 z-9999 hidden bg-black/70 backdrop-blur-sm overflow-y-auto"
>
  <!-- Center Container -->
  <div class="min-h-screen flex justify-center items-start py-10 px-4">

    <!-- Modal -->
    <div
      id="assistance-panel"
      class="relative w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden"
    >

      <!-- Close -->
      <button
        id="close-assistance"
        class="absolute top-5 right-5 w-11 h-11 rounded-full bg-red-600 text-white hover:bg-red-700 transition z-50"
      >
        ✕
      </button>

      <!-- Header -->
      <div class="bg-linear-to-r from-red-600 to-red-700 px-10 py-12 text-center">

        <div
          class="mx-auto w-20 h-20 rounded-full bg-white/20 flex items-center justify-center"
        >
          <i
            data-lucide="headset"
            class="w-10 h-10 text-white"
          ></i>
        </div>

        <h2 class="mt-6 text-4xl font-bold text-white">
          Request Assistance
        </h2>

        <p class="mt-3 text-red-100 max-w-xl mx-auto leading-7">
          Need help regarding recruitment, deployment, documentation,
          application status or employer concerns? Fill out the form below and
          our support team will contact you shortly.
        </p>

      </div>

      <!-- BODY -->
      <div class="max-h-[70vh] overflow-y-auto p-8 md:p-10">

        <form class="space-y-6">

          <!-- Name -->
          <div class="grid md:grid-cols-2 gap-6">

            <div>
              <label class="block mb-2 font-medium text-gray-700">
                First Name
              </label>

              <input
                type="text"
                placeholder="Juan"
                class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
              />
            </div>

            <div>
              <label class="block mb-2 font-medium text-gray-700">
                Last Name
              </label>

              <input
                type="text"
                placeholder="Dela Cruz"
                class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
              />
            </div>

          </div>

          <!-- Contact -->
          <div class="grid md:grid-cols-2 gap-6">

            <div>

              <label class="block mb-2 font-medium text-gray-700">
                Email Address
              </label>

              <input
                type="email"
                placeholder="juan@email.com"
                class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
              />

            </div>

            <div>

              <label class="block mb-2 font-medium text-gray-700">
                Phone Number
              </label>

              <input
                type="text"
                placeholder="+63 9XX XXX XXXX"
                class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
              />

            </div>

          </div>

          <!-- Concern -->
          <div>

            <label class="block mb-2 font-medium text-gray-700">
              Concern
            </label>

            <select
              class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
            >
              <option>Select Concern</option>
              <option>Recruitment</option>
              <option>Deployment</option>
              <option>Documentation</option>
              <option>Application Status</option>
              <option>Employer Concern</option>
              <option>Others</option>
            </select>

          </div>

          <!-- Subject -->
          <div>
            <label class="block mb-2 font-medium text-gray-700">
              Subject
            </label>

            <input
              type="text"
              name="subject"
              placeholder="Enter subject"
              class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
            />
          </div>

          <!-- Preferred Contact Method & Urgency -->
          <div class="grid md:grid-cols-2 gap-6">

            <div>
              <label class="block mb-2 font-medium text-gray-700">
                Preferred Contact Method
              </label>

              <select
                name="preferred_contact"
                class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
              >
                <option value="">Select Contact Method</option>
                <option>Email</option>
                <option>Phone</option>
                <option>Either Email or Phone</option>
              </select>
            </div>

            <div>
              <label class="block mb-2 font-medium text-gray-700">
                Urgency Level
              </label>

              <select
                name="urgency"
                class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
              >
                <option value="">Select Urgency</option>
                <option>Low</option>
                <option selected>Normal</option>
                <option>High</option>
                <option>Urgent</option>
              </select>
            </div>

            </div>

            <!-- Message -->
            <div>

              <label class="block mb-2 font-medium text-gray-700">
                Message
              </label>

              <textarea
                rows="6"
                name="message"
                placeholder="Tell us how we can help..."
                class="w-full rounded-xl border border-gray-300 px-5 py-4 resize-none focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none"
              ></textarea>

            </div>

            <!-- Submit Button -->
            <div class="pt-2">
              <button
                type="submit"
                class="w-full rounded-xl bg-red-600 py-4 text-white font-semibold hover:bg-red-700 transition duration-300"
              >
                Send Request
              </button>
            </div>

        </form>
      </div>
    </div>
  </div>
</div>
